services:
  papertrader:
    build: .
    restart: unless-stopped          # comes back after crashes and reboots
    ports:
      - "127.0.0.1:8000:8000"        # dashboard only reachable from this machine
    volumes:
      - ./data:/app/data             # database, models and logs survive rebuilds
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
