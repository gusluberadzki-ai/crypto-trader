# Temporary: checks the AI model connection and saves the raw result to the `debug` branch.
name: agent-debug
on: workflow_dispatch
permissions:
  contents: write
  models: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir out && cd out
          env | grep -i proxy > proxy.txt || true
          curl -sS -i -L -X POST https://models.github.ai/inference/chat/completions \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Reply with the JSON {\"ok\": true}"}]}' > curl.txt 2>&1 || true
          python3 - <<'PY' > py.txt 2>&1 || true
          import os, httpx
          r = httpx.post("https://models.github.ai/inference/chat/completions", json={"model": "openai/gpt-4.1-mini", "messages": [{"role": "user", "content": "say hi"}]},
                         headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Content-Type": "application/json"}, timeout=60, follow_redirects=True)
          print(r.status_code, r.headers, r.history, r.text[:500])
          PY
          pip list 2>/dev/null | grep -i httpx >> py.txt || true
          git init -q -b debug && git add -A && git -c user.name=bot -c user.email=a@b.c commit -qm debug
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" debug
