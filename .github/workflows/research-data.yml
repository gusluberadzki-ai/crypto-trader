# Manual: downloads several years of hourly price history for strategy research into the `research-data` branch.
name: research-data
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx
      - run: mkdir out && cd out && python ../research/fetch_history.py
      - run: |
          cd out && git init -q -b research-data && git add -A
          git -c user.name="papertrader-bot" -c user.email="actions@users.noreply.github.com" commit -qm "price history $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-data
