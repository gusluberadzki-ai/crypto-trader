# Runs the paper-trading bot once an hour on GitHub's free runners and publishes the dashboard
# to GitHub Pages. Bot state (SQLite + models) is kept on the `state` branch between runs.
name: paper-trader

on:
  schedule:
    - cron: "8,38 * * * *"   # twice an hour: decision after each candle close + a price refresh (backup if GitHub skips one)
  workflow_dispatch:      # "Run workflow" button for a manual run

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Trading never waits for the website: it runs in its own job, one at a time.
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: paper-trader-trading
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Restore bot state
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth 1 origin state
            git archive FETCH_HEAD | tar -x -C data
            echo "state restored"
          else
            echo "first run: starting fresh"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Is the AI agent due today?
        id: agent
        run: echo "due=$(python -m papertrader --config config.yaml agent-due 2>/dev/null | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Start the AI model (free, open-source, runs on this machine)
        if: steps.agent.outputs.due == 'true'
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) ; sleep 3
          for i in $(seq 1 30); do curl -s localhost:11434/api/version && break; sleep 2; done
          ollama pull qwen2.5:7b
          echo "LLM_BASE_URL=http://localhost:11434/v1" >> "$GITHUB_ENV"
          echo "LLM_MODEL=qwen2.5:7b" >> "$GITHUB_ENV"

      - name: Trading step
        run: python -m papertrader --config config.yaml step --site site
        env:
          PT_DATA_SOURCE: auto

      - name: Save bot state
        if: always()
        run: |
          cd data
          rm -rf logs
          [ -f papertrader.db ] || exit 0
          git init -q -b state
          git add -A
          git -c user.name="papertrader-bot" -c user.email="actions@users.noreply.github.com" commit -qm "state $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishing the dashboard is a separate job, so a slow or stuck deployment can't block trading.
  deploy:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: paper-trader-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
